name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # A real Postgres for the build, which reads the catalogue from the database.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: veloura
          POSTGRES_PASSWORD: veloura
          POSTGRES_DB: veloura
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U veloura"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://veloura:veloura@localhost:5432/veloura
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:ci
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      # The server code against this Postgres: orders, races, the admin, the rate limit.
      - run: npm run test:integration
      - run: npm run build
        env:
          CI: true
      # A real browser through the built site: checkout, accounts, the admin.
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: |
          # A throwaway secret for this run's sessions; the real one only lives in Vercel.
          export BETTER_AUTH_SECRET=$(openssl rand -hex 32)
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
